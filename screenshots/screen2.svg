<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796"><rect width="1290" height="2796" fill="#f6f0e5"/><text x="100" y="180" fill="#173a3a" font-family="Georgia" font-size="58">Bible Scribe</text><text x="100" y="250" fill="#6f7772" font-family="Arial" font-size="28">John 1 · English (ESV)</text><rect x="80" y="370" width="1130" height="1500" rx="30" fill="#fffaf1" stroke="#d8c6a4" stroke-width="3"/><text x="150" y="540" fill="#173a3a" font-family="Georgia" font-size="46">In the beginning was the Word,</text><text x="150" y="630" fill="#173a3a" font-family="Georgia" font-size="46">and the Word was with God,</text><text x="150" y="720" fill="#173a3a" font-family="Georgia" font-size="46">and the Word was God.</text><line x1="150" y1="950" x2="1140" y2="950" stroke="#d8c6a4" stroke-width="3"/><text x="150" y="1060" fill="#9d8e70" font-family="Arial" font-size="28">Type the verse slowly and attentively.</text><rect x="80" y="2050" width="1130" height="120" rx="60" fill="#173a3a"/><text x="645" y="2125" fill="#f1d38a" font-family="Arial" font-size="36" text-anchor="middle">Begin transcription</text></svg>
